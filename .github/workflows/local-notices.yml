name: Local notices

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'   # every hour at minute 41

permissions:
  contents: write

concurrency:
  group: save-data
  cancel-in-progress: false

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node read-local.mjs
      - name: Save the data files
        run: |
          git config user.name "sumner-robot"
          git config user.email "sumner-robot@users.noreply.github.com"
          git add local
          git diff --cached --quiet && exit 0
          git commit -m "Local notices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
