name: Read publications

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Book ids, comma separated, or all.'
        required: false
        default: 'all'
      text:
        description: 'Book ids whose plain text should also be saved, for tuning. Usually empty.'
        required: false
        default: ''
  schedule:
    - cron: '17 3 3 * *'   # 03:17 UTC on the 3rd of each month

permissions:
  contents: write

concurrency:
  group: save-data
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save pdfjs-dist@6.2.108
      - run: node read-books.mjs
        env:
          ONLY: ${{ inputs.only }}
          TEXT: ${{ inputs.text }}
      - name: Save the data files
        run: |
          git config user.name "sumner-robot"
          git config user.email "sumner-robot@users.noreply.github.com"
          git add pubdata
          if [ -d pubtext ]; then git add pubtext; fi
          git diff --cached --quiet && exit 0
          git commit -m "Publications data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
